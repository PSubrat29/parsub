name: Publish to PyPI

# Publishing uses PyPI "Trusted Publishing": no password or API token is stored.
# One-time setup is described in docs/development_guide.md ("Publishing to PyPI").
#
# - Publishing a GitHub release (tag vX.Y.Z) uploads to PyPI.
# - Running the workflow manually uploads to TestPyPI (or PyPI, if chosen).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Where to upload"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/parsub/__init__.py').read()).group(1))")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi

      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/venv/bin/parsub --version
          /tmp/venv/bin/parsub demo --run --output-dir /tmp/demo

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Upload to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/parsub
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Upload to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/parsub
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
