name: Website

# Builds the Jekyll site (README.md + docs/) and checks the live website.
# - Pages source "GitHub Actions": this workflow deploys the site.
# - Pages source "Deploy from a branch" (master, /): GitHub deploys it; this
#   workflow only checks that the build works and that the live pages respond.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.settings.outputs.build_type }}
      site: ${{ steps.settings.outputs.site }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the GitHub Pages settings
        id: settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          info=$(gh api "repos/${{ github.repository }}/pages" \
                 --jq '"\(.build_type) \(.html_url) \(.source.branch // "-"):\(.source.path // "-")"' 2>/dev/null \
                 || echo "none - -")
          read -r build_type site source <<< "$info"
          echo "GitHub Pages: build_type=${build_type} site=${site} source=${source}"
          echo "build_type=${build_type}" >> "$GITHUB_OUTPUT"
          echo "site=${site}" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
        if: steps.settings.outputs.build_type == 'workflow'

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3
        if: steps.settings.outputs.build_type == 'workflow'

  deploy:
    needs: build
    if: needs.build.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  check:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success' && needs.build.outputs.build_type != 'none' && needs.deploy.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Check the live website
        env:
          SITE: ${{ needs.build.outputs.site }}
        run: |
          for page in "" "docs/" "docs/user_guide.html" "docs/docker.html" "docs/validation.html" "docs/changelog.html"; do
            ok=no
            for attempt in $(seq 1 12); do
              status=$(curl -s -o /tmp/page.html -w "%{http_code}" "${SITE}${page}")
              if [ "$status" = 200 ] && grep -q "ParSub" /tmp/page.html; then ok=yes; break; fi
              sleep 20
            done
            echo "${SITE}${page} -> HTTP ${status}, ok=${ok}"
            test "$ok" = yes
          done
