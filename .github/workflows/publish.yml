name: Publish to PyPI

# Publishing uses PyPI "Trusted Publishing": no password or API token is stored.
# One-time setup is described in docs/development_guide.md ("Publishing to PyPI").
#
# - Publishing a GitHub release (tag vX.Y.Z) uploads version X.Y.Z to PyPI.
# - Running the workflow manually with "testpypi" uploads a unique rehearsal
#   version X.Y.Z.devN to TestPyPI, so rehearsals can be repeated at any time.
# - Running it manually with "pypi" uploads the current version to PyPI.
# Every upload is followed by installing that exact version from the index.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Where to upload"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

env:
  TARGET: ${{ github.event_name == 'release' && 'pypi' || inputs.repository }}

jobs:
  build:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine the version
        id: version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/parsub/__init__.py').read()).group(1))")
          if [ "${TARGET}" = "testpypi" ]; then
            # TestPyPI never accepts the same file twice: give every rehearsal its own version
            version="${version}.dev$(( GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT ))"
            sed -i "s/^__version__ = .*/__version__ = \"${version}\"/" src/parsub/__init__.py
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ParSub ${version} for ${TARGET}"

      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package version ${VERSION} (src/parsub/__init__.py)"
            exit 1
          fi

      - name: Check that this version is not on PyPI yet
        if: env.TARGET == 'pypi'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/parsub/${VERSION}/json")
          if [ "$status" = 200 ]; then
            echo "::error::ParSub ${VERSION} is already on PyPI. PyPI never accepts a version twice: raise __version__ in src/parsub/__init__.py and release again."
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/venv/bin/parsub --version
          /tmp/venv/bin/parsub demo --run --output-dir /tmp/demo

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Upload to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/parsub/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Upload to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/parsub/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  verify:
    name: Install the uploaded version
    needs: [build, testpypi, pypi]
    if: always() && (needs.testpypi.result == 'success' || needs.pypi.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ParSub ${{ needs.build.outputs.version }} from the index
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "${TARGET}" = "testpypi" ]; then
            index="--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/"
          else
            index=""
          fi
          python -m venv /tmp/venv
          # a new upload can take a few minutes to appear in the index
          for attempt in $(seq 1 20); do
            if /tmp/venv/bin/pip install --no-cache-dir ${index} "parsub==${VERSION}"; then break; fi
            if [ "$attempt" = 20 ]; then echo "::error::parsub==${VERSION} could not be installed"; exit 1; fi
            sleep 30
          done
          cd /tmp
          /tmp/venv/bin/parsub --version
          /tmp/venv/bin/parsub demo --run --output-dir /tmp/demo
